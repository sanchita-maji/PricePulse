services:
  pricepulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pricepulse_web
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - APP_ENV=production
    restart: unless-stopped
